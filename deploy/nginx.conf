server {
    # 3011: porta do serviço no container (o EasyPanel publica esta porta no domínio)
    listen 3011;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # add_header no nível do server não é herdado por locations que tenham add_header próprio,
    # por isso o cache usa `expires` (que não interfere na herança).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    # assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # dados de coleta e HTML: sempre revalidar (o arquivo muda quando os pontos são regerados)
    location = /index.html {
        expires -1;
    }

    location /data/ {
        expires -1;
        try_files $uri =404;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
